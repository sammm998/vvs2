[project]
name = "takeoff"
version = "0.1.0"
description = "Mangdforteckning ur vektor-PDF av VVS-byggritning"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
takeoff = "takeoff.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
